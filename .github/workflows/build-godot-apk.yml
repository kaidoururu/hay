name: Build Godot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.2.2
  EXPORT_PRESET_NAME: "Android"
  EXPORT_NAME: "hay"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.2.2
      env:
        # Встроенный отладочный ключ из контейнера — ничего создавать не нужно
        GODOT_ANDROID_KEYSTORE_DEBUG_PATH: "/root/debug.keystore"
        GODOT_ANDROID_KEYSTORE_DEBUG_USER: "androiddebugkey"
        GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: "android"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fix project.godot and export_presets.cfg
        run: |
          # 1. Включаем ETC2/ASTC — без этого headless-экспорт падает с пустой ошибкой
          if ! grep -q "import_etc2_astc" project.godot; then
            echo "Добавляем import_etc2_astc в project.godot..."
            # Добавляем секцию [rendering], если её вдруг нет
            if ! grep -q "^\[rendering\]" project.godot; then
              echo -e "\n[rendering]" >> project.godot
            fi
            echo "textures/vram_compression/import_etc2_astc=true" >> project.godot
          fi

          # 2. Добавляем пустые поля keystore/debug в export_presets.cfg,
          #    чтобы Godot использовал встроенный debug-keystore из editor settings
          if ! grep -q "keystore/debug=" export_presets.cfg; then
            echo "Добавляем пустые поля keystore/debug в export_presets.cfg..."
            # Вставляем после секции [preset.0.options]
            sed -i '/^\[preset.0.options\]/a keystore/debug=""\nkeystore/debug_user=""\nkeystore/debug_password=""' export_presets.cfg
          fi

      - name: Setup Godot environment
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

          mkdir -v -p ~/.config/godot
          if [ -f /root/.config/godot/editor_settings-4.tres ]; then
            cp /root/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.tres
          else
            echo '[gd_resource type="EditorSettings" format=2]' > ~/.config/godot/editor_settings-4.tres
            echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          fi
          # Прописываем путь к Java SDK (JDK 17), если его ещё нет
          if ! grep -q "export/android/java_sdk_path" ~/.config/godot/editor_settings-4.tres; then
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.tres
          fi

      - name: Create build directory
        run: mkdir -v -p build/android

      - name: Export Android APK (Debug)
        run: |
          # --export-debug автоматически использует debug.keystore из editor settings
          godot --headless --verbose --export-debug "${{ env.EXPORT_PRESET_NAME }}" "build/android/${{ env.EXPORT_NAME }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 7
