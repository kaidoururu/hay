name: Build Godot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Download Godot 4.2.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -O godot.zip
          unzip -o godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64

      - name: Download export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          unzip -o templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.2.2.stable/"

      - name: Generate debug keystore and editor settings
        run: |
          mkdir -p "$HOME/.local/share/godot"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.local/share/godot/editor_settings-4.2.2.tres" <<EOF
          [editor_settings]

          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore_file = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hay.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hay-apk
          path: build/hay.apk
