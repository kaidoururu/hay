name: Build Godot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check logger.gd exists
        run: |
          if [ ! -f scripts/logger.gd ]; then
            echo "::error::scripts/logger.gd не найден в репозитории. Добавь этот файл из архива hay_logger2.zip"
            exit 1
          fi
          echo "scripts/logger.gd найден"
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK готов: ${ANDROID_HOME}"
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          test -f "${GITHUB_WORKSPACE}/debug.keystore" && echo "keystore готов"
      - name: Download Godot 4.2.2
        run: |
          curl -sS -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -o godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          curl -sS -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
      - name: Install export templates
        run: |
          unzip -o templates.tpz -d /tmp/godot_templates
          GODOT_VERSION="$(cat /tmp/godot_templates/templates/version.txt)"
          echo "Версия шаблонов: ${GODOT_VERSION}"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "${DEST}"
          mv /tmp/godot_templates/templates/* "${DEST}/"
          if [ ! -f "${DEST}/android_debug.apk" ]; then
            echo "::error::Шаблон android_debug.apk не найден в ${DEST}"
            find "$HOME/.local/share/godot" -type f | head -50
            exit 1
          fi
          echo "Шаблоны установлены в ${DEST}"
      - name: Patch project.godot
        run: |
          python3 - <<'PYEOF'
          import re, os, sys

          path = "project.godot"
          if not os.path.exists(path):
              print("ERROR: project.godot не найден")
              sys.exit(1)

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          RENDERING_KEYS = [
              ("textures/vram_compression/import_etc2_astc", "true"),
              ("renderer/rendering_method.mobile", '"gl_compatibility"'),
          ]
          AUTOLOAD_KEY = ("Logger", '"*res://scripts/logger.gd"')

          REMOVE_PATTERNS = [
              re.compile(r'^\s*textures/vram_compression/import_etc2_astc\s*=.*$'),
              re.compile(r'^\s*renderer/rendering_method\.mobile\s*=.*$'),
              re.compile(r'^\s*Logger\s*=\s*["\']?\*?res://scripts/logger\.gd.*$'),
          ]

          lines = text.splitlines()
          cleaned = []
          removed = []
          for ln in lines:
              if any(p.match(ln) for p in REMOVE_PATTERNS):
                  removed.append(ln)
                  continue
              cleaned.append(ln)
          lines = cleaned

          def set_key(lines, section, key, value):
              in_sec = False
              for i, ln in enumerate(lines):
                  s = ln.strip()
                  if s == "[" + section + "]":
                      in_sec = True
                      continue
                  if s.startswith("[") and s.endswith("]"):
                      if in_sec:
                          break
                      continue
                  if in_sec and re.match(r'^\s*' + re.escape(key) + r'\s*=', ln):
                      lines[i] = key + "=" + value
                      return lines, "updated"
              for i, ln in enumerate(lines):
                  if ln.strip() == "[" + section + "]":
                      lines.insert(i + 1, key + "=" + value)
                      return lines, "inserted"
              lines.append("")
              lines.append("[" + section + "]")
              lines.append(key + "=" + value)
              return lines, "appended"

          if removed:
              print("Удалены старые/битые строки патча:")
              for r in removed:
                  print("  -", r.strip())

          report = []
          for key, val in RENDERING_KEYS:
              lines, how = set_key(lines, "rendering", key, val)
              report.append("rendering/%s -> %s (%s)" % (key, val, how))

          lines, how = set_key(lines, "autoload", AUTOLOAD_KEY[0], AUTOLOAD_KEY[1])
          report.append("autoload/%s -> %s (%s)" % (AUTOLOAD_KEY[0], AUTOLOAD_KEY[1], how))

          with open(path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print("Патч project.godot применён:")
          for r in report:
              print("  ", r)
          PYEOF
          echo "=== project.godot после патча ==="
          cat project.godot
      - name: Generate export_presets.cfg
        run: |
          cat > export_presets.cfg <<'PRESETEOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/hay.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name=""
          package/unique_name="com.example.hay"
          package/name="hay"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/remove_default=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          keystore/debug="__KEYSTORE_PATH__"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          PRESETEOF
          sed -i "s|__KEYSTORE_PATH__|${GITHUB_WORKSPACE}/debug.keystore|; s|__SDK_PATH__|${ANDROID_HOME}|; s|__JDK_PATH__|${JAVA_HOME}|" export_presets.cfg
          echo "=== export_presets.cfg после генерации ==="
          cat export_presets.cfg
      - name: Write editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [editor]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          EOF
          echo "Настройки редактора записаны"
      - name: Import project
        run: |
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --import > import.log 2>&1 || true
          tail -5 import.log || true
      - name: Export APK
        run: |
          mkdir -p build
          set +e
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hay.apk
          RESULT=$?
          set -e
          if [ ${RESULT} -ne 0 ] || [ ! -f build/hay.apk ]; then
            echo "=== RETRY WITH VERBOSE FOR DIAGNOSTICS ==="
            ./Godot_v4.2.2-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/hay.apk
            exit 1
          fi
          ls -la build/hay.apk
      - name: Verify APK contents
        run: |
          if [ ! -f build/hay.apk ]; then
            echo "::error::APK не создан"
            exit 1
          fi
          unzip -l build/hay.apk | tee apk_contents.txt
          if ! unzip -l build/hay.apk | grep -q "lib/arm64-v8a/libgodot_android.so"; then
            echo "::error::В APK нет libgodot_android.so (arm64) — библиотека не попала в сборку"
            exit 1
          fi
          echo "Проверка APK пройдена"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hay-apk
          path: build/hay.apk
