name: Build Godot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Принять лицензии Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          echo "Использую sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

      - name: Создать debug-keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Скачать Godot и шаблоны экспорта
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -o Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates
          unzip -o Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/

      - name: Настроить Godot (пути к SDK и keystore)
        run: |
          mkdir -p ~/.config/godot
          touch ~/.config/godot/editor_settings-4.tres
          printf 'filesystem/export/android/android_sdk_path="%s"\n' "$ANDROID_HOME" >> ~/.config/godot/editor_settings-4.tres
          printf 'filesystem/export/android/java_sdk_path="%s"\n' "$JAVA_HOME" >> ~/.config/godot/editor_settings-4.tres
          printf 'filesystem/export/android/debug_keystore="%s"\n' "$HOME/.android/debug.keystore" >> ~/.config/godot/editor_settings-4.tres
          printf 'filesystem/export/android/debug_keystore_user="%s"\n' "androiddebugkey" >> ~/.config/godot/editor_settings-4.tres
          printf 'filesystem/export/android/debug_keystore_pass="%s"\n' "android" >> ~/.config/godot/editor_settings-4.tres

      - name: Импорт проекта и экспорт APK
        run: |
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hay.apk

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: hay-apk
          path: build/hay.apk
