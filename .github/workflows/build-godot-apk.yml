name: Build Godot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.2.2 and export templates
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -o godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          cd ~/.local/share/godot/export_templates
          unzip -o $GITHUB_WORKSPACE/templates.tpz
          mv templates 4.2.2.stable

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure keystore and SDK paths
        run: |
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"${GITHUB_WORKSPACE}/debug.keystore\"|" export_presets.cfg
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [editor_settings]

          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          cat ~/.config/godot/editor_settings-4.tres
          grep keystore export_presets.cfg

      - name: Import project
        run: ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hay.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hay-apk
          path: build/hay.apk
