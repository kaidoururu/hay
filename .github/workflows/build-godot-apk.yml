name: Build Godot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Версия Godot должна совпадать с версией проекта (в project.godot указано 4.2)
  GODOT_VERSION: 4.2.2
  EXPORT_PRESET_NAME: "Android"
  EXPORT_NAME: "hay"

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest

    container:
      # Используем конкретную версию, чтобы избежать ошибки с env в этом поле
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot environment
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Create build directory
        run: mkdir -v -p build/android

      - name: Export Android APK (Debug)
        run: |
          # Используем --export-debug, чтобы не требовался release-keystore
          godot --headless --verbose --export-debug "${{ env.EXPORT_PRESET_NAME }}" "build/android/${{ env.EXPORT_NAME }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 7
