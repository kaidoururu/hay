name: Build Godot Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.2.2
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -o godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          curl -L -o Godot_v4.2.2-stable_export_templates.tpz https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz

      - name: Install export templates
        run: |
          set -e
          mkdir -p /tmp/godot_templates
          unzip -o Godot_v4.2.2-stable_export_templates.tpz -d /tmp/godot_templates
          VERSION=$(cat /tmp/godot_templates/templates/version.txt)
          echo "Template version: $VERSION"
          DEST="$HOME/.local/share/godot/export_templates/$VERSION"
          mkdir -p "$DEST"
          mv /tmp/godot_templates/templates/* "$DEST/"
          if [ ! -f "$DEST/android_debug.apk" ]; then
            echo "ERROR: android_debug.apk not found after install!"
            find "$HOME/.local/share/godot" -type f || true
            exit 1
          fi
          echo "Templates installed at $DEST:"
          ls -la "$DEST"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Write export presets
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/hay.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          java_source_conversion_mode=1
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name=""
          package/unique_name="com.example.hay"
          package/name="Hay"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          screen/allow_orientation=0
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/remote_public_key=""
          permissions/custom_permissions=PackedStringArray()
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/debug_release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF
          KEYSTORE_PATH="$PWD/debug.keystore"
          sed -i "s|keystore/debug=\"debug.keystore\"|keystore/debug=\"$KEYSTORE_PATH\"|" export_presets.cfg
          echo "--- export_presets.cfg ---"
          cat export_presets.cfg

      - name: Patch project.godot
        run: |
          python3 - <<'PYEOF'
          import re, sys

          path = "project.godot"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
          except FileNotFoundError:
              print("project.godot not found"); sys.exit(1)

          bad_patterns = [
              r"^\s*renderer/rendering_method\.mobile\s*=.*$",
              r"^\s*textures/vram_compression/import_etc2_astc\s*=.*$",
          ]
          for pat in bad_patterns:
              content = re.sub(pat, "", content, flags=re.MULTILINE)
          content = content.replace("\n\n\n", "\n\n")

          additions = {
              "[rendering]": [
                  'renderer/rendering_method.mobile="gl_compatibility"',
                  'textures/vram_compression/import_etc2_astc=true',
              ],
          }

          for section, lines in additions.items():
              m = re.search(r"^" + re.escape(section) + r"\s*$", content, flags=re.MULTILINE)
              if m:
                  insert_at = m.end()
                  block = "\n" + "\n".join(lines)
                  content = content[:insert_at] + block + content[insert_at:]
              else:
                  if not content.endswith("\n"):
                      content += "\n"
                  content += section + "\n" + "\n".join(lines) + "\n"

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("--- patched project.godot ---")
          print(content)
          PYEOF

      - name: Import project
        run: ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hay.apk
          if [ ! -f build/hay.apk ]; then
            echo "=== RETRY WITH VERBOSE FOR DIAGNOSTICS ==="
            echo "--- export_presets.cfg ---"
            cat export_presets.cfg
            echo "--- project.godot ---"
            cat project.godot
            ./Godot_v4.2.2-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/hay.apk
          fi

      - name: Verify APK contents
        run: |
          if ! unzip -l build/hay.apk | grep -q "lib/arm64-v8a/libgodot_android.so"; then
            echo "ERROR: libgodot_android.so (arm64-v8a) missing from APK!"
            unzip -l build/hay.apk
            exit 1
          fi
          echo "APK OK: native library present"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hay-apk
          path: build/hay.apk
