name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "Android SDK OK: ${ANDROID_HOME}"

      - name: Download Godot 4.2.2 and export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -o Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          test -x ./Godot_v4.2.2-stable_linux.x86_64 || { echo "::error::Godot binary missing"; exit 1; }

      - name: Install export templates (with verification)
        run: |
          unzip -o Godot_v4.2.2-stable_export_templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          rm -rf "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          mv /tmp/godot_templates/templates/4.2.2.stable "$HOME/.local/share/godot/export_templates/"
          echo "--- installed templates ---"
          ls -la "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          for f in android_debug.apk android_release.apk; do
            test -f "$HOME/.local/share/godot/export_templates/4.2.2.stable/$f" || {
              echo "::error::Template $f not found at expected path"
              find /tmp/godot_templates -maxdepth 3
              exit 1
            }
          done
          echo "Export templates OK"

      - name: Patch project.godot (etc2_astc + gl_compatibility)
        run: |
          python3 << 'EOF'
          import re, os

          def set_key(text, section, key, value):
              lines = text.splitlines()
              sec_idx = None
              for i, ln in enumerate(lines):
                  if ln.strip() == "[" + section + "]":
                      sec_idx = i
                      break
              if sec_idx is None:
                  if lines and lines[-1].strip():
                      lines.append("")
                  lines.append("[" + section + "]")
                  sec_idx = len(lines) - 1
              end = len(lines)
              for i in range(sec_idx + 1, len(lines)):
                  if lines[i].strip().startswith("["):
                      end = i
                      break
              pat = re.compile(r"^\s*" + re.escape(key) + r"\s*=")
              for i in range(sec_idx + 1, end):
                  if pat.match(lines[i]):
                      lines[i] = key + "=" + value
                      return "\n".join(lines) + "\n"
              lines.insert(end, key + "=" + value)
              return "\n".join(lines) + "\n"

          path = "project.godot"
          text = open(path, encoding="utf-8").read()
          text = set_key(text, "rendering", "textures/vram_compression/import_etc2_astc", "true")
          text = set_key(text, "rendering", "renderer/rendering_method.mobile", '"gl_compatibility"')
          open(path, "w", encoding="utf-8").write(text)
          print("--- project.godot after patch ---")
          print(text)
          EOF

      - name: Generate debug keystore and patch export_presets.cfg
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          KS="$GITHUB_WORKSPACE/debug.keystore"
          python3 - "$KS" << 'EOF'
          import re, sys, os

          ks_path = sys.argv[1]

          def set_key(text, section, key, value):
              lines = text.splitlines()
              sec_idx = None
              for i, ln in enumerate(lines):
                  if ln.strip() == "[" + section + "]":
                      sec_idx = i
                      break
              if sec_idx is None:
                  if lines and lines[-1].strip():
                      lines.append("")
                  lines.append("[" + section + "]")
                  sec_idx = len(lines) - 1
              end = len(lines)
              for i in range(sec_idx + 1, len(lines)):
                  if lines[i].strip().startswith("["):
                      end = i
                      break
              pat = re.compile(r"^\s*" + re.escape(key) + r"\s*=")
              for i in range(sec_idx + 1, end):
                  if pat.match(lines[i]):
                      lines[i] = key + "=" + value
                      return "\n".join(lines) + "\n"
              lines.insert(end, key + "=" + value)
              return "\n".join(lines) + "\n"

          path = "export_presets.cfg"
          text = open(path, encoding="utf-8").read()
          text = set_key(text, "preset.0.options", "keystore/debug", '"' + ks_path + '"')
          text = set_key(text, "preset.0.options", "keystore/debug_user", '"androiddebugkey"')
          text = set_key(text, "preset.0.options", "keystore/debug_password", '"android"')
          text = set_key(text, "preset.0.options", "architectures/arm64-v8a", "true")
          text = set_key(text, "preset.0.options", "architectures/armeabi-v7a", "true")
          open(path, "w", encoding="utf-8").write(text)
          print("--- export_presets.cfg after patch ---")
          print(text)
          EOF

      - name: Import project
        run: |
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --import || true

      - name: Export APK
        run: |
          mkdir -p build
          set +e
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hay.apk
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::error::Export failed (exit $CODE), retrying with --verbose for diagnostics"
            echo "=== export_presets.cfg ==="
            cat export_presets.cfg
            echo "=== project.godot ==="
            cat project.godot
            ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --verbose --export-debug "Android" build/hay.apk
            CODE=$?
            exit $CODE
          fi
          test -f build/hay.apk || { echo "::error::APK was not produced"; exit 1; }
          echo "Export OK: build/hay.apk"

      - name: Verify APK contents
        run: |
          python3 << 'EOF'
          import zipfile, sys

          need = "lib/arm64-v8a/libgodot_android.so"
          with zipfile.ZipFile("build/hay.apk") as z:
              names = z.namelist()
          libs = [n for n in names if n.endswith(".so")]
          print("Native libraries in APK:", libs)
          if need not in names:
              print("::error::" + need + " NOT found in APK - engine native layer would fail on device")
              sys.exit(1)
          print("APK contents OK: native library present")
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hay-apk
          path: build/hay.apk
