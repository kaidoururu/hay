name: Build Godot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Export Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} --licenses > /dev/null 2>&1 || true
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Download Godot 4.2.2 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -o Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -o Godot_v4.2.2-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/4.2.2.stable

      - name: Generate debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -noprompt

      - name: Patch project.godot (enable ETC2/ASTC, fixes blank config error)
        run: |
          python3 - <<'PYEOF'
          import os, re, pathlib
          p = pathlib.Path("project.godot")
          text = p.read_text(encoding="utf-8")
          key = "textures/vram_compression/import_etc2_astc"
          pat = re.compile(r'^\s*' + re.escape(key) + r'\s*=.*$', re.M)
          if pat.search(text):
              text = pat.sub(key + "=true", text)
          elif "[rendering]" in text:
              text = text.replace("[rendering]", "[rendering]\n" + key + "=true", 1)
          else:
              text = text.rstrip("\n") + "\n\n[rendering]\n" + key + "=true\n"
          p.write_text(text, encoding="utf-8")
          print("=== project.godot after patch ===")
          for line in text.splitlines():
              if "vram_compression" in line:
                  print(line)
          PYEOF

      - name: Write editor settings (SDK, JDK, keystore)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Patch export_presets.cfg (keystore paths)
        run: |
          python3 - <<'PYEOF'
          import os, re, pathlib
          p = pathlib.Path("export_presets.cfg")
          if not p.exists():
              print("export_presets.cfg not found!")
              exit(1)
          text = p.read_text(encoding="utf-8")
          ws = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          subs = {
              "keystore/debug": '"' + ws + '/debug.keystore"',
              "keystore/debug_user": '"androiddebugkey"',
              "keystore/debug_password": '"android"',
          }
          for key, val in subs.items():
              pat = re.compile(r'^(\s*' + re.escape(key) + r'\s*=\s*).*$')
              if pat.search(text):
                  text = pat.sub(lambda m: m.group(1) + val, text)
              else:
                  text = text.rstrip("\n") + "\n" + key + "=" + val + "\n"
          p.write_text(text, encoding="utf-8")
          print("=== export_presets.cfg (keystore lines) ===")
          for line in text.splitlines():
              if "keystore" in line:
                  print(line)
          PYEOF

      - name: Import project
        run: ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          set +e
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hay.apk
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "=== RETRY WITH VERBOSE FOR DIAGNOSTICS ==="
            ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --verbose --export-debug "Android" build/hay.apk
          fi
          ls -la build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hay-apk
          path: build/hay.apk
